<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git-hub</title>
<style>
  :root {
    --bg: #121317;
    --panel: #1a1c22;
    --panel-2: #202329;
    --border: #2b2e36;
    --text: #eef0f3;
    --text-dim: #93969f;
    --accent: #ffffff;
    --accent-dim: #8a6a1f;
    --accent-2: #ff4d6d;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
  }

  a { color: inherit; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    background-color: var(--bg);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 2px;
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    text-decoration: none;
    white-space: nowrap;
  }

  .logo .bracket {
    color: var(--accent);
  }

  .search-container {
    flex: 1;
    max-width: 460px;
  }

  .search-container input {
    width: 100%;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background-color: var(--panel);
    color: var(--text);
    outline: none;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .search-container input::placeholder {
    color: var(--text-dim);
  }

  .search-container input:focus {
    border-color: var(--accent);
    background-color: var(--panel-2);
  }

  /* Secondary nav bar */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .nav-links {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 6px;
  }

  .nav-links a {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
    padding: 8px 16px;
    border-radius: 8px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  .nav-links a svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }

  .nav-links a:hover {
    color: var(--text);
    background-color: var(--panel-2);
  }

  .nav-links a.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }

  /* Page content shell */
  .page-content {
    padding: 36px 24px 72px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  .section-count {
    font-size: 13px;
    color: var(--text-dim);
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .card {
    background-color: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(155deg, var(--panel-2), var(--panel));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    position: relative;
  }

  .card-thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.12), transparent 60%);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card:hover .card-thumb::after {
    opacity: 1;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-thumb svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    position: relative;
  }

  .card-label {
    padding: 10px 12px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.1px;
  }

  .empty-msg {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Footer */
  .site-footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  .site-footer .bracket {
    color: var(--accent);
  }

  /* Centered logo hero */
  .hero-center {
    text-align: center;
    padding: 72px 24px 56px;
  }

  .hero-center .big-logo {
    font-size: 64px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 10px;
  }

  .hero-center p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .top-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  .top-section .section-head {
    margin-bottom: 18px;
    justify-content: center;
    text-align: center;
  }

  .top-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  @media (max-width: 640px) {
    .top-grid { grid-template-columns: 1fr; }
    .hero-center .big-logo { font-size: 48px; }
  }
</style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <a href="index.html" class="logo"><span class="bracket">&lt;/&gt;</span>git-hub</a>
    <div class="search-container">
      <input type="text" placeholder="Search games...">
    </div>
  </div>

  <!-- Secondary nav bar -->
  <div class="navbar">
    <div class="nav-links">
      <a href="index.html" class="active">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="games.html">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="2"/><line x1="9" y1="7" x2="9" y2="19"/><circle cx="6" cy="10.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="6" cy="15.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        Games
      </a>
      <a href="movies.html">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/><path d="M12 18v2"/></svg>
        Movies
      </a>
    </div>
  </div>

  <!-- Centered logo hero -->
  <div class="hero-center">
    <div class="big-logo">&lt;/&gt;</div>
    <p>git-hub — pick something and play</p>
  </div>

  <!-- Top 3 Games -->
  <div class="top-section">
    <div class="section-head">
      <h2 class="section-title">Top 3 Games This Week</h2>
    </div>
    <div class="top-grid">
      <a href="play/clslope.html" class="card" target="_blank" rel="noopener">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="2"/><line x1="9" y1="7" x2="9" y2="19"/></svg>
        </div>
        <div class="card-label">Slope</div>
      </a>
      <a href="play/cl1v1lol.html" class="card" target="_blank" rel="noopener">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="2"/><line x1="9" y1="7" x2="9" y2="19"/></svg>
        </div>
        <div class="card-label">1v1.LOL</div>

      <a href="play/cltemplerun2.html" class="card" target="_blank" rel="noopener">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="2"/><line x1="9" y1="7" x2="9" y2="19"/></svg>
        </div>
        <div class="card-label">Temple Run 2</div>
      </a>
    </div>
  </div>

  <!-- Top 3 Movies -->
  <div class="top-section">
    <div class="section-head">
      <h2 class="section-title">Top 3 Movies</h2>
    </div>
    <div class="top-grid">
      <a href="movies.html" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #ffffff, #ff4d6d); aspect-ratio: 2/3;"></div>
        <div class="card-label">Night Horizon</div>
      </a>
      <a href="movies.html" class="card">

      <a href="movies.html" class="card">

        <div class="card-label">Crimson Peak Trail</div>
      </a>
    </div>
  </div>

  <div class="site-footer">
    <span class="bracket">&lt;/&gt;</span> git-hub — made for endless procrastination
  </div>

</body>
</html>
