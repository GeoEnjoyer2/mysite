<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git-hub - Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #121212;
    --bg-darker: #0c0c0c;
    --bar-grey: #1c1c1c;
    --grey-light: #2a2a2a;
    --grey-border: #333333;
    --text-light: #e6e6e6;
    --text-muted: #9a9a9a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Silkscreen', 'Segoe UI', Arial, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-light);
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: var(--bg-darker);
    padding: 12px 20px;
    border-bottom: 1px solid var(--grey-border);
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 0.5px;
  }

  .search-container {
    flex: 1;
    max-width: 500px;
    margin: 0 20px;
  }

  .search-container input {
    width: 100%;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--grey-border);
    background-color: var(--grey-light);
    color: var(--text-light);
    outline: none;
    font-size: 14px;
    font-family: inherit;
  }

  .search-container input::placeholder {
    color: var(--text-muted);
  }

  /* Secondary nav bar */
  .navbar {
    display: flex;
    align-items: center;
    background-color: var(--bar-grey);
    border-bottom: 1px solid var(--grey-border);
    padding: 0 10px;
  }

  .nav-arrow {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    padding: 10px 8px;
    cursor: pointer;
  }

  .nav-links {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 12px 6px;
    flex: 1;
  }

  .nav-links a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .nav-links a svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
  }

  .nav-links a.active,
  .nav-links a:hover {
    color: var(--text-light);
  }

  /* Page content */
  .page-content {
    padding: 30px 20px 60px;
  }

  .section-title {
    font-size: 16px;
    letter-spacing: 1px;
    margin: 0 0 20px;
    color: var(--text-light);
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
  }

  .card {
    background-color: var(--bar-grey);
    border: 1px solid var(--grey-border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--text-muted);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 2 / 3;
    background-color: var(--grey-light);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  .card-thumb svg {
    width: 36px;
    height: 36px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
  }

  .card-label {
    padding: 10px 10px 12px;
    font-size: 12px;
    color: var(--text-light);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">git-hub</div>

      <input type="text" placeholder="Search movies...">

  <div class="navbar">

    <div class="nav-links">

      <a href="movies.html" class="active">

    <button class="nav-arrow">&#10095;</button>

  <!-- Page content -->

    <h2 class="section-title">ALL MOVIES</h2>
    <div class="card-grid">
      <div class="card">

        </div>
        <div class="card-label">Night Horizon</div>
      </div>
      <div class="card">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/></svg>
        </div>
        <div class="card-label">Last Signal</div>
      </div>
      <div class="card">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/></svg>
        </div>
        <div class="card-label">Crimson Peak Trail</div>
      </div>
      <div class="card">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/></svg>
        </div>
        <div class="card-label">The Long Drive</div>
      </div>
      <div class="card">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/></svg>
        </div>
        <div class="card-label">Static City</div>
      </div>
      <div class="card">
        <div class="card-thumb">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/></svg>
        </div>
        <div class="card-label">Hollow Frequency</div>
      </div>
    </div>
  </div>

</body>
</html>
