<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivza-play — Movies</title>
<style>
  :root {
    --bg: #121317;
    --panel: #1a1c22;
    --panel-2: #202329;
    --border: #2b2e36;
    --text: #eef0f3;
    --text-dim: #93969f;
    --accent: #ffffff;
    --accent-dim: #8a6a1f;
    --accent-2: #ff4d6d;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
  }

  a { color: inherit; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    background-color: var(--bg);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 2px;
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    text-decoration: none;
    white-space: nowrap;
  }

  .logo .bracket {
    color: var(--accent);
  }

  .search-container {
    flex: 1;
    max-width: 460px;
  }

  .search-container input {
    width: 100%;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background-color: var(--panel);
    color: var(--text);
    outline: none;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .search-container input::placeholder {
    color: var(--text-dim);
  }

  .search-container input:focus {
    border-color: var(--accent);
    background-color: var(--panel-2);
  }

  /* Secondary nav bar */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .nav-links {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 6px;
  }

  .nav-links a {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
    padding: 8px 16px;
    border-radius: 8px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  .nav-links a svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }

  .nav-links a:hover {
    color: var(--text);
    background-color: var(--panel-2);
  }

  .nav-links a.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }

  /* Page content shell */
  .page-content {
    padding: 36px 24px 72px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  .section-count {
    font-size: 13px;
    color: var(--text-dim);
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .card {
    background-color: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(155deg, var(--panel-2), var(--panel));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    position: relative;
  }

  .card-thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.12), transparent 60%);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card:hover .card-thumb::after {
    opacity: 1;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-thumb svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    position: relative;
  }

  .card-label {
    padding: 10px 12px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.1px;
  }

  .empty-msg {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Footer */
  .site-footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  .site-footer .bracket {
    color: var(--accent);
  }

  .card-thumb { aspect-ratio: 2 / 3; }

/* IVZA-PLAY NIGHT MODE REDESIGN */
:root{
 --bg:#070d2c;--panel:rgba(11,22,66,.88);--panel-2:rgba(28,48,112,.88);
 --border:rgba(142,174,255,.25);--text:#eef3ff;--text-dim:#b2c3ef;
 --accent:#9bc9ff;--accent-dim:#6d8ee8;--accent-2:#d6a7ff;
}
html{scroll-padding-top:24px}
body{min-height:100vh;background:var(--bg);font-family:Inter,"Segoe UI",Arial,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url("assets/pixel-city.png") center 48%/cover no-repeat;opacity:.76;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(3,8,34,.35),rgba(4,10,39,.62) 60%,rgba(3,8,30,.78));pointer-events:none}
.topbar{position:sticky;top:0;z-index:20;min-height:74px;padding:12px clamp(16px,4vw,54px);background:rgba(4,9,35,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);box-shadow:0 8px 30px #02072555}
.logo{align-items:center;gap:12px;font-size:18px;letter-spacing:.04em}
.logo img{width:42px;height:34px;object-fit:contain;filter:drop-shadow(0 0 10px #7baaff55)}
.logo img.brand-wordmark{width:clamp(100px,13vw,170px);height:auto;max-height:48px;object-fit:contain;filter:drop-shadow(0 0 10px #7baaff55)}
.hero-center .big-logo img.hero-wordmark{display:block;width:min(699px,88vw);height:auto;filter:drop-shadow(0 10px 30px #060b3a99)}
.logo .brand-word{font-weight:800;color:#eaf2ff}
.navbar{position:sticky;top:74px;z-index:19;background:rgba(7,15,52,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-links{gap:10px;padding:9px 12px}
.nav-links a{padding:10px 18px;border-radius:9px;color:#b9c9f5}
.nav-links a:hover,.nav-links a.active{background:rgba(103,143,255,.16);color:#fff}
.nav-links a.active{border-bottom:2px solid var(--accent);box-shadow:inset 0 -8px 18px #7baaff0c}
.page-content{max-width:1380px;padding:clamp(28px,5vw,64px) clamp(16px,4vw,48px) 84px}
.section-head{align-items:center;margin-bottom:26px}
.section-title{font-size:clamp(23px,3vw,34px);letter-spacing:-.035em;color:#f1f5ff;text-shadow:0 0 24px #8ab5ff45}
.section-count{padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:#0b1749bd;color:#c6d6ff}
.card-grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:18px}
.card{position:relative;background:rgba(8,18,57,.88);border:1px solid rgba(148,177,255,.24);border-radius:13px;box-shadow:0 12px 28px #02072442;backdrop-filter:blur(7px)}
.card:hover{transform:translateY(-5px);border-color:#9fcaff;box-shadow:0 16px 36px #01062180,0 0 0 1px #91b8ff30}
.card-thumb{overflow:hidden;background:linear-gradient(135deg,#233e8c,#10183f 58%,#4c3d91);min-height:130px}
.card-thumb img[src="placeholder"]{display:none}
.card-thumb:has(img[src="placeholder"])::before{content:"✦";font-size:36px;color:#d9e7ff;text-shadow:0 0 22px #92b9ff;position:absolute;inset:0;display:grid;place-items:center}
.card-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(4,10,35,.22));pointer-events:none}
.card-label{padding:13px 14px 15px;font-size:13px;color:#edf3ff;letter-spacing:.01em}
.search-container input{border-radius:12px;border:1px solid #8baeff55;background:rgba(7,16,51,.88);padding:12px 16px;color:#f4f7ff}
.search-container input:focus{border-color:#a6ceff;box-shadow:0 0 0 3px #8ab5ff20;background:#0a174a}
.hero-center{padding:clamp(68px,11vw,140px) 20px 100px;position:relative}
.hero-center .big-logo{display:flex;justify-content:center;margin:0 auto 24px}
.hero-center .big-logo img{display:block;width:min(690px,88vw);height:auto;filter:drop-shadow(0 10px 30px #060b3a99)}
.hero-center p{font-size:clamp(14px,2vw,17px);color:#d0dcff;margin:0 0 30px;letter-spacing:.025em}
.hero-center .search-container{max-width:470px}
.hero-center .search-container input{padding:15px 20px}
.site-footer{border-top:1px solid var(--border);background:rgba(4,9,34,.72);padding:26px 18px;color:#b3c4f2;backdrop-filter:blur(12px)}
.site-footer img{width:24px;height:18px;object-fit:contain;vertical-align:middle;margin-right:8px}
.empty-msg{color:#d3dfff}
a:focus-visible,input:focus-visible{outline:2px solid #b8d8ff;outline-offset:3px}
@media(max-width:640px){
 .topbar{min-height:64px;padding:10px 16px}.navbar{top:64px}.nav-links{width:100%;gap:3px}.nav-links a{padding:9px 11px;font-size:12px}
 .page-content{padding-top:30px}.card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-thumb{min-height:115px}
 .hero-center{padding:72px 18px 78px}.hero-center .big-logo img{width:min(560px,94vw)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

</style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <a href="index.html" class="logo" aria-label="Ivza-play home"><img src="assets/symbol-logo.png" alt=""><img class="brand-wordmark" src="assets/wordmark.png" alt="Ivza-play"></a>
    <div class="search-container">
      <input type="text" id="movieSearch" placeholder="Search movies...">
    </div>
  </div>

  <!-- Secondary nav bar -->
  <div class="navbar">
    <div class="nav-links">
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="games.html">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="2"/><line x1="9" y1="7" x2="9" y2="19"/><circle cx="6" cy="10.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="6" cy="15.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        Games
      </a>
      <a href="movies.html" class="active">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/><path d="M12 18v2"/></svg>
        Movies
      </a>
    </div>
  </div>

  <!-- Page content -->
  <div class="page-content">
    <div class="section-head">
      <h2 class="section-title">All Movies</h2>
      <span class="section-count" id="movieCount"></span>
    </div>
    <div class="card-grid" id="movieGrid">
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #ffffff, #ff4d6d);"></div>
        <div class="card-label">Night Horizon</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #4d7cff, #1a1c22);"></div>
        <div class="card-label">Last Signal</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #ff4d4d, #2b0f0f);"></div>
        <div class="card-label">Crimson Peak Trail</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #ffffff, #2b2b2b);"></div>
        <div class="card-label">The Long Drive</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #9a4dff, #1a1c22);"></div>
        <div class="card-label">Static City</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #4dffcf, #142b28);"></div>
        <div class="card-label">Hollow Frequency</div>
      </a>
    </div>
    <p class="empty-msg" id="movieEmptyMsg">No movies match your search.</p>
  </div>

  <div class="site-footer">
    <img src="assets/symbol-logo.png" alt=""> IVZA-PLAY — your little corner of the night
  </div>

  <script>
    const searchInput = document.getElementById('movieSearch');
    const cards = Array.from(document.querySelectorAll('#movieGrid .card'));
    const emptyMsg = document.getElementById('movieEmptyMsg');
    const countEl = document.getElementById('movieCount');

    function updateCount(n) {
      countEl.textContent = n + (n === 1 ? ' movie' : ' movies');
    }
    updateCount(cards.length);

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      let visible = 0;
      cards.forEach(card => {
        const label = card.querySelector('.card-label').textContent.toLowerCase();
        const match = label.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      emptyMsg.style.display = visible === 0 ? 'block' : 'none';
      updateCount(visible);
    });
  </script>

</body>
</html>
