<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git-hub - Movies</title>
<style>
  :root {
    --bg: #121317;
    --panel: #1a1c22;
    --panel-2: #202329;
    --border: #2b2e36;
    --text: #eef0f3;
    --text-dim: #93969f;
    --accent: #ffffff;
    --accent-dim: #8a6a1f;
    --accent-2: #ff4d6d;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
  }

  a { color: inherit; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    background-color: var(--bg);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 2px;
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    text-decoration: none;
    white-space: nowrap;
  }

  .logo .bracket {
    color: var(--accent);
  }

  .search-container {
    flex: 1;
    max-width: 460px;
  }

  .search-container input {
    width: 100%;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background-color: var(--panel);
    color: var(--text);
    outline: none;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .search-container input::placeholder {
    color: var(--text-dim);
  }

  .search-container input:focus {
    border-color: var(--accent);
    background-color: var(--panel-2);
  }

  /* Secondary nav bar */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .nav-links {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 6px;
  }

  .nav-links a {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
    padding: 8px 16px;
    border-radius: 8px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  .nav-links a svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }

  .nav-links a:hover {
    color: var(--text);
    background-color: var(--panel-2);
  }

  .nav-links a.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }

  /* Page content shell */
  .page-content {
    padding: 36px 24px 72px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  .section-count {
    font-size: 13px;
    color: var(--text-dim);
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .card {
    background-color: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(155deg, var(--panel-2), var(--panel));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    position: relative;
  }

  .card-thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.12), transparent 60%);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card:hover .card-thumb::after {
    opacity: 1;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-thumb svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    position: relative;
  }

  .card-label {
    padding: 10px 12px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.1px;
  }

  .empty-msg {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Footer */
  .site-footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  .site-footer .bracket {
    color: var(--accent);
  }

  .card-thumb { aspect-ratio: 2 / 3; }
</style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <a href="index.html" class="logo"><span class="bracket">&lt;/&gt;</span>git-hub</a>
    <div class="search-container">
      <input type="text" id="movieSearch" placeholder="Search movies...">
    </div>
  </div>

  <!-- Secondary nav bar -->
  <div class="navbar">
    <div class="nav-links">
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="games.html">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="2"/><line x1="9" y1="7" x2="9" y2="19"/><circle cx="6" cy="10.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="6" cy="15.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        Games
      </a>
      <a href="movies.html" class="active">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8"/><path d="M12 18v2"/></svg>
        Movies
      </a>
    </div>
  </div>

  <!-- Page content -->
  <div class="page-content">
    <div class="section-head">
      <h2 class="section-title">All Movies</h2>
      <span class="section-count" id="movieCount"></span>
    </div>
    <div class="card-grid" id="movieGrid">
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #ffffff, #ff4d6d);"></div>
        <div class="card-label">Night Horizon</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #4d7cff, #1a1c22);"></div>
        <div class="card-label">Last Signal</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #ff4d4d, #2b0f0f);"></div>
        <div class="card-label">Crimson Peak Trail</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #ffffff, #2b2b2b);"></div>
        <div class="card-label">The Long Drive</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #9a4dff, #1a1c22);"></div>
        <div class="card-label">Static City</div>
      </a>
      <a href="#" class="card">
        <div class="card-thumb" style="background: linear-gradient(155deg, #4dffcf, #142b28);"></div>
        <div class="card-label">Hollow Frequency</div>
      </a>
    </div>
    <p class="empty-msg" id="movieEmptyMsg">No movies match your search.</p>
  </div>

  <div class="site-footer">
    <span class="bracket">&lt;/&gt;</span> git-hub — made for endless procrastination
  </div>

  <script>
    const searchInput = document.getElementById('movieSearch');
    const cards = Array.from(document.querySelectorAll('#movieGrid .card'));
    const emptyMsg = document.getElementById('movieEmptyMsg');
    const countEl = document.getElementById('movieCount');

    function updateCount(n) {
      countEl.textContent = n + (n === 1 ? ' movie' : ' movies');
    }
    updateCount(cards.length);

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      let visible = 0;
      cards.forEach(card => {
        const label = card.querySelector('.card-label').textContent.toLowerCase();
        const match = label.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      emptyMsg.style.display = visible === 0 ? 'block' : 'none';
      updateCount(visible);
    });
  </script>

</body>
</html>
